<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description"
          content="Sistema local de gestao financeira" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      O manifest guarda informacoes caso o app seja instalado como PWA
      em celular ou desktop. Por enquanto nao precisamos mexer nele.
    -->

    <!--
      %PUBLIC_URL% aponta para a pasta public quando o React gera o build.
      Arquivos como favicon e manifest ficam disponiveis por esse caminho.
    -->
    <title>ConsultaFinance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

    <!--
      Esta div e o ponto de entrada do React.

    -->
    <div id="root"></div>
  </body>
</html>
